name: Sync Studio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Verify committed installation bundle
        run: git diff --exit-code -- main.js
      - name: Verify Vault Folder Sync cloud engines and installation bundle
        working-directory: plugins/vault-folder-sync
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- main.js
          node --test tests/*.test.cjs
          unzip -p releases/vault-folder-sync-0.4.0.zip vault-folder-sync/main.js | cmp - main.js
      - uses: actions/upload-artifact@v4
        with:
          name: sync-studio-0.3.0-alpha
          path: dist/
          if-no-files-found: error
