name: Sync Studio
on:
  pull_request:
    paths:
      - 'plugins/refsync/**'
      - '.github/workflows/refsync.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/refsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/refsync/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run core tests
        shell: bash
        run: |
          set -o pipefail
          npm test | tee tests.log || { echo "::error::$(sed -n '/failing tests:/,$p' tests.log | head -c 1500 | tr '\n' ' ')"; exit 1; }
      - run: npm run build
      - run: git diff --exit-code -- main.js
      - name: Verify shipped archive contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          version = json.loads(Path("manifest.json").read_text())["version"]
          for suffix in ("", "-source"):
              archive = Path(f"releases/sync-studio-{version}{suffix}.zip")
              with ZipFile(archive) as shipped:
                  for item in shipped.namelist():
                      assert shipped.read(item) == Path(item.removeprefix("refsync/")).read_bytes()
          PY

      - name: Test packaged plugin in Windows Obsidian
        if: runner.os == 'Windows'
        run: |
          python -m pip install playwright==1.56.0 wsgidav==4.3.3 cheroot==11.1.2
          python scripts/windows-smoke.py 2>&1 | Tee-Object -Variable smoke
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::$(($smoke | Select-Object -Last 14) -join ' ')"
            exit 1
          }
